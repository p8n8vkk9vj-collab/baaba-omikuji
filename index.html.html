<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff5f5"><title>ばあばの勝手におみくじ｜欲深みちよ商店</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Kaku Gothic ProN','Yu Gothic',sans-serif;color:#47343b;background:#fff9f4}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 10% 10%,#ffe3ed,transparent 40%),radial-gradient(circle at 95% 90%,#fff0c5,transparent 45%),#fff9f4;display:grid;place-items:center;padding:22px}.wrap{width:min(100%,560px)}.card{border:1px solid #f4c9d7;border-radius:28px;background:#fffdfb;box-shadow:0 14px 40px #a75d7a22;padding:32px 23px;text-align:center}.eyebrow{font-size:13px;letter-spacing:.12em;color:#9e617b}h1{font-size:clamp(26px,6vw,38px);margin:12px 0 8px;color:#a73f70}.subtitle{line-height:1.8;font-size:15px}.flower{font-size:44px;margin:12px}.result{min-height:184px;border:2px dashed #f0bbce;border-radius:20px;background:#fff5f7;margin:22px 0;padding:25px 16px;display:flex;flex-direction:column;justify-content:center;gap:12px}.result h2{font-size:30px;margin:0;color:#a53d70}.result p{line-height:1.9;margin:0;white-space:pre-line}.result .luck{font-size:13px;color:#87576d}button{border:0;border-radius:999px;background:#c64c80;color:white;font-weight:bold;font-size:19px;padding:16px 34px;cursor:pointer;box-shadow:0 5px 0 #96345f}button:active{transform:translateY(3px);box-shadow:0 2px 0 #96345f}footer{font-size:12px;line-height:1.9;color:#806e76;margin-top:24px}.date{font-size:13px;color:#886b79;margin-top:14px}.note{margin-top:20px;font-size:14px;line-height:1.9;text-align:center;color:#775c66}a{color:#9b3567}@media(prefers-reduced-motion:no-preference){.result{transition:background .3s}} </style></head><body><main class="wrap"><section class="card"><div class="eyebrow">欲深みちよ商店</div><div class="flower" aria-hidden="true">🌸</div><h1>ばあばの勝手におみくじ</h1><p class="subtitle">ようこそ、笑って帰るおみくじ屋さんへ。<br>当たっても当たらなくても、笑ったあなたが大当たり！</p><div class="date" id="date"></div><div class="result" id="result" aria-live="polite"><h2>今日の運試し 🌷</h2><p>さあ、何が出るかな？<br>気楽にポチッとしてね！</p></div><button id="draw" type="button">おみくじを引く！</button><footer>※これは占いではなく、ばあばと頼さんのユーモア作品です。<br>人生の大切な判断には使わないでくださいね。🤣</footer></section><p class="note">毎日ちょっと違う笑いを、お持ち帰りください。<br>© 欲深みちよ商店</p></main><script>
'use strict';
// 編集するのはここだけ。記事に合わせたおみくじを入れたい日は、下の文章を差し替えます。
const sets=[
[{title:'大吉 🌸',message:'頭の中がお花畑になる予感！\nただし、文字だらけの人生訓に変わることも。🤣',item:'ラッキーアイテム：文字のない花束'},{title:'中吉 ☕',message:'お茶を飲む時間が幸運の入口。\nおかわりしたら、なおよし！',item:'ラッキーアイテム：お気に入りの湯のみ'},{title:'小吉 🐾',message:'小さな幸せが近くにいるかも。\n足元を見たら、犬が先に見つけているかもしれません。',item:'ラッキーアイテム：ふかふかの靴下'},{title:'大笑吉 🤣',message:'寄り道の先に原石あり。\n目的地を忘れても、笑えたら合格！',item:'ラッキーアイテム：好奇心'},{title:'大凶 🥶',message:'今日はAIに頼むと謝罪が増える予感。\nでも、その失敗が漫画になるなら大逆転！',item:'ラッキーアイテム：人間の忍耐力'}],
[{title:'大吉 💰',message:'金運上昇の予感！\nただし売上の第一号は自分かもしれません。🤣',item:'ラッキーアイテム：小さなレシート'},{title:'中吉 🌷',message:'今日は一つ始めると吉。\n完成しなくても、始めた時点で一歩前進！',item:'ラッキーアイテム：ポチッと押す指'},{title:'小吉 🤖',message:'AIさんが張り切る日。\n成果物より謝罪が先に届いたら、ネタ帳へ。',item:'ラッキーアイテム：深呼吸'},{title:'末吉 🍠',message:'甘いものを食べると機嫌が直るかも。\nお芋なら、なおよし！',item:'ラッキーアイテム：おやつ'},{title:'大笑吉 🎉',message:'思いがけない寄り道が大当たり。\n今日も予定表は飾りです！🤣',item:'ラッキーアイテム：自由時間'}],
[{title:'大吉 💕',message:'誰かに「ありがとう」を言うと吉。\n自分にも一回言ってあげましょう。',item:'ラッキーアイテム：笑顔'},{title:'中吉 🪏',message:'何気ない会話から原石がこぼれる予感。\n拾いきれなくても大丈夫！',item:'ラッキーアイテム：メモ帳'},{title:'小吉 📚',message:'読んだだけで賢くなった気分。\n内容を忘れても、気分は大切！',item:'ラッキーアイテム：しおり'},{title:'末吉 🌼',message:'予定外のことが起きるかも。\n「まあ、いっか」で道が開けます。',item:'ラッキーアイテム：ゆとり'},{title:'大凶 😱',message:'思ったものと違うものが完成する予感。\nでも笑い話になったら、もう大吉！',item:'ラッキーアイテム：ツッコミ力'}]
];
const now=new Date();const today=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',year:'numeric',month:'long',day:'numeric',weekday:'long'}).format(now);document.getElementById('date').textContent=today;
const parts=new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Tokyo',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(now);const get=t=>Number(parts.find(p=>p.type===t).value);const day=Math.floor(Date.UTC(get('year'),get('month')-1,get('day'))/86400000);const fortunes=sets[((day%sets.length)+sets.length)%sets.length];let previous=-1;const box=document.getElementById('result'),button=document.getElementById('draw');button.addEventListener('click',()=>{let i=Math.floor(Math.random()*fortunes.length);if(i===previous&&fortunes.length>1)i=(i+1+Math.floor(Math.random()*(fortunes.length-1)))%fortunes.length;previous=i;const f=fortunes[i];box.replaceChildren();const h=document.createElement('h2');h.textContent=f.title;const p=document.createElement('p');p.textContent=f.message;const small=document.createElement('div');small.className='luck';small.textContent=f.item;box.append(h,p,small);button.textContent='もう一度引く！ 🤣';});
</script></body></html>
